sonar.projectKey=kallanka-org_fogoneria-system
sonar.organization=kallanka-org
sonar.host.url=https://sonarcloud.io

sonar.sources=apps
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/generated/**,**/*.d.ts,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.tsx,**/test/**,**/__tests__/**,.github/**,.agents/**,scripts/**,**/scripts/**,apps/api/scripts/**,apps/api/prisma/migrations/**,apps/api/prisma/seed.ts,apps/api/prisma/rls-roles.ts,apps/web/app/demo/**,apps/web/e2e/**,db/**,docs/**,ops/**,docker-compose.yml,skills-lock.json,**/*.postman_collection.json,**/playwright.config.*
sonar.javascript.lcov.reportPaths=coverage/api/lcov.info,coverage/web/lcov.info,coverage/contracts/lcov.info,coverage/db/lcov.info
sonar.coverage.exclusions=**/src/generated/**,**/*.config.*,**/*.d.ts,apps/api/prisma/seed.ts,apps/api/prisma/rls-roles.ts,apps/**/scripts/**,apps/web/app/demo/**,apps/web/components/ui/Modal.tsx,apps/web/components/ui/Drawer.tsx,apps/web/components/dashboard/PlanModals.tsx

# Credenciales locales de desarrollo (no producción): se ignoran a propósito.
# Ver docs/plan-seguridad-sonar.md (migración a .env pendiente).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e1.resourceKey=docker-compose.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/api/src/config/env.validation.ts

# Temporal: el gate custom `Fogoneria` no está asignado y el default tumba
# merges de docs/configs por `new_coverage 80`. El gate efectivo de cobertura
# son los thresholds de Vitest. Reactivar a true cuando el org admin asigne
# `Fogoneria` en Project Settings → Quality Gate.
sonar.qualitygate.wait=false
sonar.qualitygate.timeout=600
