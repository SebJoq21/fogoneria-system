name: Verify API production

# Corre después de que Railway reporta el resultado del deploy; nunca lo bloquea.
# Mismo patrón que Taller (G3): el deploy y su verificación viven separados.
on:
  deployment_status:
  workflow_dispatch:

env:
  API_URL: https://fogoneria-system-production.up.railway.app

permissions:
  contents: read

jobs:
  verify:
    name: Verify API production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'test-fogoneria / production' &&
       contains(fromJSON('["success", "failure", "error"]'), github.event.deployment_status.state))
    steps:
      - name: Fallar si el deploy de Railway falló
        if: github.event_name == 'deployment_status' && github.event.deployment_status.state != 'success'
        run: |
          echo "::error::Railway deployment of ${GITHUB_SHA::7} ended in '${{ github.event.deployment_status.state }}'."
          exit 1

      - name: Health responde ok
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$API_URL/api/v1/health")
          echo "GET /api/v1/health -> $body"
          echo "$body" | jq -e '.status == "ok"'

      - name: Info de la API
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 "$API_URL/api/v1")
          echo "GET /api/v1 -> $body"
          echo "$body" | jq -e '.health == "/api/v1/health"'
