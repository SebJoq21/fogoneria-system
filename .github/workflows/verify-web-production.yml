name: Verify web production

# Corre después de que Vercel reporta el estado del deploy; nunca lo bloquea.
on:
  status:
  workflow_dispatch:

env:
  WEB_URL: https://fogoneria-system.vercel.app

permissions:
  contents: read

jobs:
  verify:
    name: Verify web production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' &&
       contains(github.event.branches.*.name, 'development') &&
       contains(fromJSON('["success", "failure", "error"]'), github.event.state))
    steps:
      - name: Fallar si el deploy de Vercel falló
        if: github.event_name == 'status' && github.event.state != 'success'
        run: |
          echo "::error::Vercel deployment of ${{ github.event.sha }} ended in '${{ github.event.state }}'."
          exit 1

      - name: Home responde
        run: |
          code=$(curl -sS -o home.html -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$WEB_URL/")
          echo "GET / -> $code"
          test "$code" = "200"
          grep -qi '<html lang="es"' home.html

      - name: Recuperación responde
        run: |
          code=$(curl -sS -o rec.html -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 20 "$WEB_URL/recuperar")
          echo "GET /recuperar -> $code"
          test "$code" = "200"
