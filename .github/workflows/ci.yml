name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fogoneria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fogoneria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_RLS: postgresql://fogoneria_rls:fogoneria_rls@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_SAAS: postgresql://fogoneria_saas:fogoneria_saas@localhost:5432/fogoneria_test?schema=fogoneria
      JWT_SECRET: ci-only-jwt-secret-change-me-32chars
      SESSION_SECRET: ci-only-session-secret-change-me-32chars
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Fronteras de módulos
        run: pnpm check:boundaries

      - name: Generar cliente Prisma
        run: pnpm --filter api db:generate

      - name: Aplicar migraciones
        run: pnpm --filter api db:deploy

      - name: Crear roles RLS
        run: pnpm --filter api db:rls:roles

      - name: Activar FORCE RLS
        run: pnpm --filter api db:rls:force

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm check-types

      - name: Pruebas unitarias API
        run: pnpm --filter api test

      - name: Pruebas e2e API (HTTP + Socket.io)
        run: pnpm --filter api test:e2e

      - name: Pruebas de base de datos (RLS, soft delete, email)
        run: pnpm --filter api test:db

      - name: Pruebas web
        run: pnpm --filter web test

      - name: Build
        run: pnpm build

  pr-scope:
    name: Un PR por módulo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verificar alcance del PR
        env:
          ALLOW_MULTI: ${{ contains(github.event.pull_request.labels.*.name, 'multi-modulo') }}
        run: node scripts/check-pr-scope.mjs "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  specs:
    name: Specs al día
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Traer la rama base
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Verificar specs
        run: pnpm check:specs --base "origin/${{ github.base_ref }}"