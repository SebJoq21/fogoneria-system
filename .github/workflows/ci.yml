name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan runs de PR; un push a development (merge) debe terminar
  # para que el commit de merge tenga su CI completo. Cancelar aquí deja la
  # rama con runs rojos/cancelados y oculta regresiones reales.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fogoneria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fogoneria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_RLS: postgresql://fogoneria_rls:fogoneria_rls@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_SAAS: postgresql://fogoneria_saas:fogoneria_saas@localhost:5432/fogoneria_test?schema=fogoneria
      JWT_SECRET: ci-only-jwt-secret-change-me-32chars
      SESSION_SECRET: ci-only-session-secret-change-me-32chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría de dependencias (bloqueante)
        # Barrido de todo el árbol: altas/críticas bloquean. El moderado de
        # `minimatch` 9 (dev tooling) queda visible y lo sigue Dependabot.
        run: pnpm audit --audit-level high || pnpm audit --audit-level high

      - name: Fronteras de módulos
        run: pnpm check:boundaries

      - name: Registros de módulos al día
        run: pnpm gen:modules --check

      - name: Paridad de módulos (reporte)
        # Advisory hasta la Fase 8: reporta el avance 20/20/20/20 sin bloquear.
        run: pnpm check:modules

      - name: Generar cliente Prisma
        run: pnpm --filter api db:generate

      - name: Aplicar migraciones
        run: pnpm --filter api db:deploy

      - name: Crear roles RLS
        run: pnpm --filter api db:rls:roles

      - name: Activar FORCE RLS
        run: pnpm --filter api db:rls:force

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm check-types

      - name: Pruebas unitarias API (con cobertura)
        run: pnpm --filter api test:cov

      - name: Pruebas e2e API (HTTP + Socket.io)
        run: pnpm --filter api test:e2e

      - name: Pruebas de base de datos (RLS, soft delete, email)
        run: pnpm --filter api test:db

      - name: Normalizar rutas de cobertura DB
        run: sed -i 's|^SF:src/|SF:apps/api/src/|' apps/api/coverage/db/lcov.info

      - name: Publicar cobertura de DB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-db
          path: apps/api/coverage/db/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Pruebas web (con cobertura)
        run: pnpm --filter web test:coverage

      - name: Pruebas de contratos (con cobertura)
        run: |
          pnpm --filter @fogoneria/contracts test:coverage
          sed -i 's|^SF:src/|SF:packages/contracts/src/|' packages/contracts/coverage/lcov.info

      - name: Pruebas de SDK y kernel (con cobertura)
        run: |
          pnpm --filter @fogoneria/sdk test:coverage
          sed -i 's|^SF:src/|SF:packages/sdk/src/|' packages/sdk/coverage/lcov.info
          pnpm --filter @fogoneria/kernel test:coverage
          sed -i 's|^SF:src/|SF:packages/kernel/src/|' packages/kernel/coverage/lcov.info

      - name: Publicar cobertura de la API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-api
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Publicar cobertura de la web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Publicar cobertura de contratos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-contracts
          path: packages/contracts/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Publicar cobertura del SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-sdk
          path: packages/sdk/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Publicar cobertura del kernel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-kernel
          path: packages/kernel/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: pnpm build

  # Construye las dos imágenes del monorepo (contexto = raíz) y las escanea con
  # Trivy. Hadolint solo bloquea errores; los avisos de estilo quedan visibles.
  docker:
    name: Imágenes Docker y Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: hadolint (API)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/api/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: hadolint (web)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/web/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Construir imagen de la API
        run: docker build -f apps/api/Dockerfile -t fogoneria-api:ci .

      - name: Construir imagen de la web
        run: docker build -f apps/web/Dockerfile -t fogoneria-web:ci .

      # Fase B: Trivy bloquea CVEs de OS/base. Los CVEs de paquetes npm de la
      # imagen se cubren con pnpm audit/Dependabot (evita mezclar devDeps).
      - name: Trivy (API, CRITICAL/HIGH corregibles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fogoneria-api:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Trivy (web, CRITICAL/HIGH corregibles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fogoneria-web:ci
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

  # Análisis estático y gate de cobertura en SonarCloud. Automatic Analysis
  # está desactivado: este job es la única vía de análisis. Sin SONAR_TOKEN
  # (forks, Dependabot) el scan se omite y el job no falla.
  sonar:
    name: SonarCloud
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # Sin dependencias el analizador TS no resuelve los tsconfig de los
      # workspaces y pierde reglas; el scan necesita node_modules.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Descargar cobertura de la API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-api
          path: coverage/api

      - name: Descargar cobertura de la web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-web
          path: coverage/web

      - name: Descargar cobertura de contratos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-contracts
          path: coverage/contracts

      - name: Descargar cobertura del SDK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-sdk
          path: coverage/sdk

      - name: Descargar cobertura del kernel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-kernel
          path: coverage/kernel

      - name: Descargar cobertura de DB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-db
          path: coverage/db

      - name: Analizar con SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0

  # E2E real de navegador: API + web + PostgreSQL sembrado. Los tests viven en
  # apps/web/e2e y Playwright arranca los dos procesos con `webServer`.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fogoneria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fogoneria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_RLS: postgresql://fogoneria_rls:fogoneria_rls@localhost:5432/fogoneria_test?schema=fogoneria
      DATABASE_URL_SAAS: postgresql://fogoneria_saas:fogoneria_saas@localhost:5432/fogoneria_test?schema=fogoneria
      JWT_SECRET: ci-only-jwt-secret-change-me-32chars
      SESSION_SECRET: ci-only-session-secret-change-me-32chars
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter api db:generate

      - name: Aplicar migraciones
        run: pnpm --filter api db:deploy

      - name: Crear roles RLS
        run: pnpm --filter api db:rls:roles

      - name: Activar FORCE RLS
        run: pnpm --filter api db:rls:force

      - name: Cargar datos demo
        run: pnpm --filter api db:seed

      - name: Instalar Chromium de Playwright
        run: pnpm --filter web e2e:install

      - name: Build de API y web
        run: pnpm build

      - name: Playwright E2E
        run: pnpm --filter web exec playwright test

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Exporta el contrato OpenAPI desde AppModule (sin levantar puerto), lo valida
  # con el validador oficial de OpenAPI y lo publica como artifact.
  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=fogoneria
      JWT_SECRET: ci-only-jwt-secret-change-me-32chars
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter api db:generate

      - name: Exportar contrato OpenAPI
        run: pnpm --filter api openapi:export

      - name: Validar contrato OpenAPI
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-venv"
          "$RUNNER_TEMP/openapi-venv/bin/pip" install --quiet --disable-pip-version-check openapi-spec-validator
          "$RUNNER_TEMP/openapi-venv/bin/openapi-spec-validator" docs/openapi.json

      - name: Publicar OpenAPI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-spec
          path: docs/openapi.json
          if-no-files-found: error
          retention-days: 7

  # Prisma forward-only: la migración es la fuente ejecutable y no hay down.
  # Se aplica dos veces (idempotencia), se verifica el estado y se detecta drift
  # entre las migraciones aplicadas en una base shadow y la base real migrada.
  migrations:
    name: Migraciones forward-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fogoneria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fogoneria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fogoneria_test?schema=fogoneria
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fogoneria_shadow?schema=fogoneria
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter api db:generate

      - name: Crear base shadow de Prisma
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE fogoneria_shadow"

      - name: Aplicar migraciones (1.ª vez)
        run: pnpm --filter api db:deploy

      - name: Aplicar migraciones (2.ª vez, idempotencia)
        run: pnpm --filter api db:deploy

      - name: Estado de migraciones
        run: pnpm --filter api exec prisma migrate status

      - name: Detectar drift (migraciones aplicadas vs base real)
        run: pnpm --filter api exec prisma migrate diff --from-migrations prisma/migrations --to-config-datasource --exit-code

  # Revisa las dependencias que el PR agrega/cambia contra el Dependency Graph.
  # Corre siempre (en push no revisa nada) para que el gate no vea un job skipped.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Revisar dependencias
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Gate único: cualquier job en failure/cancelled/skipped lo tumba.
  # `CI requerido` es el required status check del ruleset de development.
  ci:
    name: CI requerido
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, docker, dependency-review, sonar, e2e, openapi, migrations]
    steps:
      - name: Exigir que todos los jobs pasen
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

      - name: Confirmar gate verde
        run: echo "Todos los jobs de CI pasaron."
