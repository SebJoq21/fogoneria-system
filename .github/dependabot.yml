version: 2

updates:
  # Monorepo pnpm: un solo entry en la raíz cubre los package.json de workspaces.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Majors que rompen el runtime o la matriz de tests (Node 24 / Vitest 4).
    # Se actualizan a mano en un PR de plataforma revisado.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-tsconfig-paths"
        update-types: ["version-update:semver-major"]
    groups:
      npm-produccion-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
      npm-desarrollo-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Las actions están pinneadas por SHA completo; un major se revisa a mano.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # Runtime Node 24; Node 26 se evalúa en un PR de plataforma.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-api-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # Runtime Node 24; Node 26 se evalúa en un PR de plataforma.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-web-minor-patch:
        update-types: ["minor", "patch"]
